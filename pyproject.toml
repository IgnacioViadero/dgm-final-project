[project]
name = "dgm-final-project"
version = "0.1.0"
description = "Sistema multiagente de análisis de riesgo de crédito al consumo."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ignacio Viadero" }, { name = "Jaime Pedrosa" }, { name = "Guzmán Pérez" }]
dependencies = [
    "pydantic>=2.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "requests>=2.32",
    "rich>=13.9",
    "python-dotenv>=1.1",
    "pandas>=3.0",
    "langchain-text-splitters>=1.1.3",
]

[project.optional-dependencies]
llm = [
    "torch>=2.8,<2.15",
    "transformers>=5.0,<6",
    "accelerate>=1.5",
]
rag = [                     
    "sentence-transformers>=5.0",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0",
]
viz = [                      # figuras del informe (eval/plot_numeric.py)
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pandas>=3.1.1",
    "pytest>=8.3",
    "ruff>=0.11",
]

[project.scripts]
arca-api = "api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "agent_core", "agents", "router", "tool_use", "eval", "rag"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
